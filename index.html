<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>iPad デジタル看板</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            /* 背景画像（ファイル名は実際の画像に合わせてください） */
            background-image: url('haikei.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            
            /* フォントの指定：英語はDIN、日本語は游ゴシックBold */
            font-family: 'DIN', 'DIN Alternate', '游ゴシック体', 'YuGothic', 'Yu Gothic M', 'Yu Gothic', sans-serif;
            font-weight: bold;
            color: #000000;
            overflow: hidden;
            position: relative;
        }

        /* 文字を配置する透明な箱（左詰め・隙間均等） */
        .content-box {
            position: absolute;
            left: 38%;
            top: 25%;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4vh; /* 行間の調整はここ */
        }

        /* 各項目の文字サイズ */
        .project { font-size: 5.5vw; }
        .company { font-size: 2.8vw; }
        .clients { font-size: 2.8vw; }
        .time    { font-size: 3.5vw; }
        .workers { font-size: 2.8vw; }
    </style>
</head>
<body>

    <div class="content-box">
        <div class="project" id="project"></div>
        <div class="company" id="company"></div>
        
        <div class="clients">
            <span id="client1"></span><span id="comma_client"></span><span id="client2"></span>
        </div>
        
        <div class="time">
            <span id="start_time"></span><span id="tilde_time"></span><span id="end_time"></span>
        </div>
        
        <div class="workers">
            <span id="worker1"></span><span id="slash_worker"></span><span id="worker2"></span>
        </div>
    </div>

    <script>
        const GIST_ID = "fcada0a5444f5904771a838442ed9c7b";
        
        async function fetchSignageData() {
            try {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`);
                const gistData = await response.json();
                
                const contentString = gistData.files["signage.json"].content;
                const data = JSON.parse(contentString);
                
                // データを各場所に入れる
                document.getElementById('project').innerText = data.project || "";
                document.getElementById('company').innerText = data.company || "";
                document.getElementById('client1').innerText = data.client1 || "";
                document.getElementById('client2').innerText = data.client2 || "";
                document.getElementById('start_time').innerText = data.start_time || "";
                document.getElementById('end_time').innerText = data.end_time || "";
                document.getElementById('worker1').innerText = data.worker1 || "";
                document.getElementById('worker2').innerText = data.worker2 || "";

                // ①だけ入力されて②が空欄のときの処理
                document.getElementById('comma_client').innerText = (data.client1 && data.client2) ? "、 " : "";
                document.getElementById('slash_worker').innerText = (data.worker1 && data.worker2) ? " / " : "";

                // 時間の「〜」の表示・非表示の処理
                const start = data.start_time || "";
                const end = data.end_time || "";
                if (start === "終日") {
                    document.getElementById('tilde_time').innerText = ""; // 終日の場合は消す
                } else if (start !== "" || end !== "") {
                    document.getElementById('tilde_time').innerText = "〜"; // どちらかが入っていれば「〜」を表示
                } else {
                    document.getElementById('tilde_time').innerText = ""; // どちらも空欄なら消す
                }

            } catch (error) {
                console.error("データの読み込みに失敗しました", error);
            }
        }

        setInterval(fetchSignageData, 10000);
        fetchSignageData();
    </script>
</body>
</html>
