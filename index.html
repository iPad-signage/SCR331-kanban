<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad デジタル看板</title>
    <style>
        body { margin: 0; padding: 0; background-image: url('haikei.jpg'); background-size: cover; background-position: center; height: 100vh; font-family: 'DIN', 'DIN Alternate', '游ゴシック体', 'YuGothic', 'Yu Gothic M', 'Yu Gothic', sans-serif; font-weight: bold; color: #000000; overflow: hidden; position: relative; }
        .content-box { position: absolute; left: 38%; top: 25%; width: 60%; display: flex; flex-direction: column; align-items: flex-start; gap: 3vh; }
        .company-client-group { display: flex; flex-direction: column; gap: 0.5vh; }
        .project { font-size: 5.5vw; }
        .company { font-size: 2.8vw; }
        .clients { font-size: 2.8vw; }
        .time    { font-size: 3.5vw; }
        .workers { font-size: 2.8vw; }
        #tilde_time { white-space: pre; }
    </style>
</head>
<body>

    <div class="content-box">
        <div class="project" id="project"></div>
        <div class="company-client-group" id="company_group">
            <div class="company" id="company"></div>
            <div class="clients" id="producers"></div>
            <div class="clients" id="pms"></div>
        </div>
        <div class="time" id="time_block">
            <span id="start_time"></span><span id="tilde_time"></span><span id="end_time"></span>
        </div>
        <div class="workers" id="workers"></div>
    </div>

    <script>
        const GIST_ID = "fcada0a5444f5904771a838442ed9c7b";
        
        // 💡 Helper: 様を付ける処理
        const formatNames = (n1, n2) => [n1, n2].filter(Boolean).map(n => `${n} 様`).join("　");

        // 💡 Helper: 作業者（3人対応）のテキストを作る処理
        const formatWorkers = (w1, w2, w3) => {
            const arr = [w1, w2, w3].filter(Boolean);
            if (arr.length === 3) return `${w1} / ${w2.split(" ")[0]}・${w3.split(" ")[0]}`;
            return arr.join(" / ");
        };

        // 💡 Helper: テキストを入れて、空なら非表示にする処理
        const updateUI = (id, text) => {
            const el = document.getElementById(id);
            el.innerText = text || "";
            el.style.display = text ? "block" : "none";
        };

        async function fetchSignageData() {
            try {
                const response = await fetch(`https://gist.githubusercontent.com/raw/${GIST_ID}/signage.json?t=${Date.now()}`, { cache: "no-store" });
                if (!response.ok) throw new Error("データの取得に失敗");
                
                const data = await response.json();
                const { project, company, producer1, producer2, pm1, pm2, start_time, end_time, worker1, worker2, worker3 } = data;
                
                // --- 1. 基本情報の更新 ---
                updateUI('project', project);
                updateUI('company', company);
                
                const prodText = formatNames(producer1, producer2);
                const pmText = formatNames(pm1, pm2);
                updateUI('producers', prodText);
                updateUI('pms', pmText);
                
                // 会社、P、PMのどれかがあればグループを表示
                document.getElementById('company_group').style.display = (company || prodText || pmText) ? "flex" : "none";

                // --- 2. 時間の更新 ---
                const timeBlock = document.getElementById('time_block');
                if (!start_time && !end_time) {
                    timeBlock.style.display = "none";
                } else {
                    timeBlock.style.display = "block";
                    document.getElementById('start_time').innerText = start_time || "";
                    document.getElementById('end_time').innerText = end_time || "";
                    document.getElementById('tilde_time').innerText = (start_time === "終日") ? "" : " 〜 ";
                }

                // --- 3. 作業者の更新 ---
                updateUI('workers', formatWorkers(worker1, worker2, worker3));

            } catch (error) {
                console.error("通信エラー:", error);
            }
        }

        setInterval(fetchSignageData, 10000);
        fetchSignageData();
    </script>
</body>
</html>
