<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iPad デジタル看板</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('haikei.jpg'); 
            background-size: cover;
            background-position: center;
            height: 100vh;
            font-family: 'DIN', 'DIN Alternate', '游ゴシック体', 'YuGothic', 'Yu Gothic M', 'Yu Gothic', sans-serif;
            font-weight: bold;
            color: #000000;
            overflow: hidden;
            position: relative;
        }

        .content-box {
            position: absolute;
            left: 38%;
            top: 25%;
            width: 60%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 3vh; 
        }

        .company-client-group {
            display: flex;
            flex-direction: column;
            gap: 0.5vh; 
        }

        .project { font-size: 5.5vw; }
        .company { font-size: 2.8vw; }
        .clients { font-size: 2.8vw; }
        .time    { font-size: 3.5vw; }
        .workers { font-size: 2.8vw; }
        
        #tilde_time { white-space: pre; }
    </style>
</head>
<body>

    <div class="content-box">
        <div class="project" id="project"></div>
        
        <div class="company-client-group" id="company_group">
            <div class="company" id="company"></div>
            <div class="clients" id="producers"></div>
            <div class="clients" id="pms"></div>
        </div>
        
        <div class="time" id="time_block">
            <span id="start_time"></span><span id="tilde_time"></span><span id="end_time"></span>
        </div>
        
        <div class="workers" id="workers"></div>
    </div>

    <script>
        const GIST_ID = "fcada0a5444f5904771a838442ed9c7b";
        
        function formatNames(name1, name2) {
            let n1 = name1 || "";
            let n2 = name2 || "";
            if (n1 && n2) return n1 + " 様　" + n2 + " 様";
            if (n1) return n1 + " 様";
            if (n2) return n2 + " 様";
            return "";
        }

        async function fetchSignageData() {
            try {
                // 👇【ここが修正ポイント】URLの末尾に現在の時間をくっつけて「毎回違うURL」だとiPadに錯覚させ、強制的に最新データを取らせる最強の設定です
                const url = `https://api.github.com/gists/${GIST_ID}?t=${new Date().getTime()}`;
                const response = await fetch(url, { cache: "no-store" });
                
                const gistData = await response.json();
                const data = JSON.parse(gistData.files["signage.json"].content);
                
                const projEl = document.getElementById('project');
                projEl.innerText = data.project || "";
                projEl.style.display = data.project ? "block" : "none";

                const compEl = document.getElementById('company');
                compEl.innerText = data.company || "";
                compEl.style.display = data.company ? "block" : "none";

                const prodEl = document.getElementById('producers');
                const prodText = formatNames(data.producer1, data.producer2);
                prodEl.innerText = prodText;
                prodEl.style.display = prodText ? "block" : "none";

                const pmEl = document.getElementById('pms');
                const pmText = formatNames(data.pm1, data.pm2);
                pmEl.innerText = pmText;
                pmEl.style.display = pmText ? "block" : "none";

                document.getElementById('company_group').style.display = 
                    (data.company || prodText || pmText) ? "flex" : "none";

                const start = data.start_time || "";
                const end = data.end_time || "";
                const timeBlock = document.getElementById('time_block');
                
                if (!start && !end) {
                    timeBlock.style.display = "none";
                } else {
                    timeBlock.style.display = "block";
                    document.getElementById('start_time').innerText = start;
                    document.getElementById('end_time').innerText = end;
                    if (start === "終日") {
                        document.getElementById('tilde_time').innerText = "";
                    } else {
                        document.getElementById('tilde_time').innerText = " 〜 ";
                    }
                }

                const w1 = data.worker1 || "";
                const w2 = data.worker2 || "";
                const wBlock = document.getElementById('workers');
                let wText = "";
                if (w1 && w2) wText = w1 + " / " + w2;
                else if (w1) wText = w1;
                else if (w2) wText = w2;
                
                wBlock.innerText = wText;
                wBlock.style.display = wText ? "block" : "none";

            } catch (error) {
                console.error("データの読み込みに失敗しました", error);
            }
        }

        setInterval(fetchSignageData, 10000);
        fetchSignageData();
    </script>
</body>
</html>
