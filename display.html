<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SCR看板">
    
    <title>SCR331 informationboard</title>
    <link rel="apple-touch-icon" href="SCR331_information_icon.png">
    <link rel="icon" href="SCR331_information_icon.png">
    <style>
        body { margin: 0; padding: 0; background-image: url('haikei.jpg'); background-size: cover; background-position: center; height: 100vh; font-family: 'DIN', 'DIN Alternate', '游ゴシック体', 'YuGothic', sans-serif; font-weight: bold; color: #000000; overflow: hidden; position: relative; }
        
        /* 
           ★ height: 55vh; を指定して全体の縦幅を固定し、
           ★ justify-content: space-between; を指定して間隔を自動で均等に広げます 
        */
        .content-box { position: absolute; left: 38%; top: 25%; width: 60%; height: 55vh; display: flex; flex-direction: column; align-items: flex-start; justify-content: space-between; }
        
        .company-client-group { display: flex; flex-direction: column; gap: 0.5vh; }
        
        .project { font-size: 5.5vw; line-height: 1.2; }
        .company { font-size: 2.8vw; line-height: 1.2; }
        .clients { font-size: 2.8vw; line-height: 1.2; }
        .time    { font-size: 3.5vw; line-height: 1.2; }
        .workers { font-size: 2.8vw; line-height: 1.2; }
        
        #error_msg { position: absolute; top: 10px; left: 10px; color: red; font-size: 1.5vw; display: none; background: rgba(255,255,255,0.8); padding: 5px; z-index: 100; }
    </style>
</head>
<body>
    <div id="error_msg">通信エラーが発生しました</div>
    <div class="content-box">
        <div class="project" id="project"></div>
        <div class="company-client-group" id="company_group">
            <div class="company" id="company"></div>
            <div class="clients" id="producers"></div>
            <div class="clients" id="pms"></div>
        </div>
        <div class="time" id="time_block"></div>
        <div class="workers" id="workers"></div>
    </div>

    <script>
        const RAW_DATA_URL = "https://iPad-signage.github.io/SCR331-kanban/data.json";

        const isEmpty = (str) => !str || str.trim() === "";

        const formatNames = (n1, n2) => {
            const validNames = [n1, n2].filter(n => !isEmpty(n)).map(n => n.trim());
            if (validNames.length === 0) return "";
            return validNames.map(n => `${n} 様`).join(" / ");
        };
        
        const formatWorkers = (w1, w2, w3) => {
            const validWorkers = [w1, w2, w3].filter(w => !isEmpty(w)).map(w => w.trim());
            if (validWorkers.length === 0) return "";
            if (validWorkers.length === 3) return `${validWorkers[0]} / ${validWorkers[1].split(" ")[0]}・${validWorkers[2].split(" ")[0]}`;
            return validWorkers.join(" / ");
        };
        
        const updateUI = (id, text) => {
            const el = document.getElementById(id);
            // ★ 空の場合は要素自体を非表示にし、文字がある場合のみ表示する仕様に戻しました
            if (isEmpty(text)) {
                el.style.display = "none";
            } else {
                el.style.display = "block";
                el.innerText = text;
            }
        };

        async function fetchSignageData() {
            try {
                const res = await fetch(RAW_DATA_URL + "?t=" + new Date().getTime());
                if (!res.ok) throw new Error("データ取得失敗");
                
                const cloudData = await res.json();
                const data = cloudData.current || {};
                
                document.getElementById('error_msg').style.display = 'none';
                
                updateUI('project', data.project);
                updateUI('company', data.company);
                updateUI('producers', formatNames(data.producer1, data.producer2));
                updateUI('pms', formatNames(data.pm1, data.pm2));
                
                // 会社・PD・PMのグループ要素自体の表示制御
                const compGroup = document.getElementById('company_group');
                if (isEmpty(data.company) && isEmpty(formatNames(data.producer1, data.producer2)) && isEmpty(formatNames(data.pm1, data.pm2))) {
                    compGroup.style.display = "none";
                } else {
                    compGroup.style.display = "flex";
                }
                
                let timeText = "";
                const timeBlockEl = document.getElementById('time_block');
                if (!isEmpty(data.start_time) || !isEmpty(data.end_time)) {
                    if (data.start_time === "終日") {
                        timeText = "終日";
                        timeBlockEl.style.fontSize = "2.8vw";
                    } else {
                        const st = isEmpty(data.start_time) ? "" : data.start_time;
                        const et = isEmpty(data.end_time) ? "" : data.end_time;
                        timeText = `${st} 〜 ${et}`;
                        timeBlockEl.style.fontSize = "";
                    }
                } else {
                    timeBlockEl.style.fontSize = "";
                }
                updateUI('time_block', timeText);
                
                updateUI('workers', formatWorkers(data.worker1, data.worker2, data.worker3));
                
            } catch (err) {
                document.getElementById('error_msg').innerText = "通信エラー: " + err.message;
                document.getElementById('error_msg').style.display = 'block';
            }
        }

        setInterval(fetchSignageData, 10000); 
        fetchSignageData();
    </script>
</body>
</html>
